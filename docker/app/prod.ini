; код на проде меняется только деплоем, который перезапускает контейнер,
; поэтому stat() файлов на каждый запрос — чистые расходы
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.max_accelerated_files=10000

; логи php-fpm уходят в stdout контейнера
error_log=/proc/self/fd/2

expose_php=Off
