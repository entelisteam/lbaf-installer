# Статика из public/, все остальные запросы — в src/index.php.

server {
    listen 8080;
    server_name _;

    charset utf-8;

    root /app/public;

    # phpmyadmin: внутренний контейнер, наружу только через этот префикс.
    # proxy_pass со слешем на конце срезает /dbui, обратно ссылки чинит PMA_ABSOLUTE_URI
    location = /dbui {
        absolute_redirect off;
        return 301 /dbui/;
    }

    location /dbui/ {
        proxy_pass http://phpmyadmin:80/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # импорт дампов: дефолтный 1m тихо режет загрузку
        client_max_body_size 64m;
    }

    # статика: существующий файл отдаем напрямую, иначе — в приложение
    location / {
        try_files $uri @app;
    }

    location @app {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/src/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass app:9000;
    }
}
